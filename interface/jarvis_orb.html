<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000011;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        #state-label {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
            z-index: 10;
            pointer-events: none;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .voice-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .voice-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
        }

        .voice-bar {
            width: 3px;
            background: #00d4ff;
            border-radius: 2px;
            transition: height 0.08s ease;
            box-shadow: 0 0 10px #00d4ff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="state-label">EN VEILLE</div>

    <div class="voice-indicator">
        <div class="voice-wave" id="voice-wave">
            <div class="voice-bar" style="height:5px"></div>
            <div class="voice-bar" style="height:8px"></div>
            <div class="voice-bar" style="height:5px"></div>
            <div class="voice-bar" style="height:10px"></div>
            <div class="voice-bar" style="height:5px"></div>
            <div class="voice-bar" style="height:8px"></div>
            <div class="voice-bar" style="height:5px"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stateLabel = document.getElementById('state-label');

        // ── État courant ──────────────────────────────────────────────
        let currentState = 'rest';

        const STATE_LABELS = {
            rest:      'EN VEILLE',
            listening: 'ÉCOUTE',
            working:   'TRAITEMENT',
            speaking:  'PAROLE'
        };

        const stateColors = {
            rest:      { r: 0,   g: 212, b: 255 },
            listening: { r: 255, g: 170, b: 0   },
            working:   { r: 255, g: 0,   b: 255 },
            speaking:  { r: 0,   g: 255, b: 136 }
        };

        const STATE_CSS_COLORS = {
            rest:      '#00d4ff',
            listening: '#ffaa00',
            working:   '#ff00ff',
            speaking:  '#00ff88'
        };

        // ── Variables globales ────────────────────────────────────────
        let orbRadius = 60;
        let particles = [];
        let rings = [];
        let dataStreams = [];
        let hexagons = [];
        let mouseX = window.innerWidth  / 2;
        let mouseY = window.innerHeight / 2;
        let mouseInfluence = 0;
        let glitchIntensity = 0;
        let lastGlitchTime = 0;

        // ── Resize ────────────────────────────────────────────────────
        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ── Particle ──────────────────────────────────────────────────
        class Particle {
            constructor() {
                this.angle        = Math.random() * Math.PI * 2;
                this.orbitRadius  = orbRadius + 30 + Math.random() * 60;
                this.speed        = (Math.random() * 0.015 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
                this.size         = 2 + Math.random() * 4;
                this.opacity      = 0.3 + Math.random() * 0.7;
                this.orbitTilt    = Math.random() * Math.PI * 2;
                this.verticalOffset = (Math.random() - 0.5) * 40;
                this.trail        = [];
                this.maxTrailLen  = 5;
                this.pulseSpeed   = Math.random() * 0.02 + 0.01;
                this.pulseOffset  = Math.random() * Math.PI * 2;
                this.x = 0; this.y = 0; this.z = 0;
            }

            update(cx, cy, time) {
                this.angle += this.speed;
                const r = this.orbitRadius + Math.sin(time * 0.001 + this.pulseOffset) * 10;
                this.x = cx + Math.cos(this.angle) * r;
                this.y = cy + Math.sin(this.angle) * r * Math.cos(this.orbitTilt) + this.verticalOffset;
                this.z = Math.sin(this.angle) * r * Math.sin(this.orbitTilt);

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150 && mouseInfluence > 0) {
                    const force = (150 - dist) / 150 * mouseInfluence;
                    this.x += (dx / dist) * force * 2;
                    this.y += (dy / dist) * force * 2;
                }

                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrailLen) this.trail.shift();
            }

            draw(ctx, color, time) {
                const depthScale = (this.z + this.orbitRadius) / (this.orbitRadius * 2);
                const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.3 + 0.7;
                const size  = this.size * (0.5 + depthScale * 0.5) * pulse;

                // Trail
                this.trail.forEach((pt, i) => {
                    const a = (i / this.trail.length) * this.opacity * 0.3;
                    ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${a})`;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, size * (i / this.trail.length) * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Outer glow
                ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${this.opacity * 0.3 * depthScale})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${this.opacity * depthScale})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();

                // Bright center
                if (this.opacity > 0.7) {
                    ctx.fillStyle = `rgba(255,255,255,${this.opacity * 0.7 * depthScale})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sparkle
                if (Math.random() < 0.02) {
                    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ── DataStream ────────────────────────────────────────────────
        class DataStream {
            constructor() { this.reset(); }

            reset() {
                this.x      = Math.random() * canvas.width;
                this.y      = -Math.random() * canvas.height;
                this.length = 20 + Math.floor(Math.random() * 30);
                this.speed  = 1 + Math.random() * 3;
                this.chars  = Array.from({ length: this.length }, () =>
                    Math.random() > 0.5 ? '1' : '0'
                );
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height + this.length * 10) this.reset();
            }

            draw(ctx, color) {
                ctx.font = '10px monospace';
                this.chars.forEach((ch, i) => {
                    const y = this.y - i * 10;
                    if (y > 0 && y < canvas.height) {
                        const a = (1 - i / this.length) * 0.25;
                        ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${a})`;
                        ctx.fillText(ch, this.x, y);
                    }
                });
            }
        }

        // ── Hexagon ───────────────────────────────────────────────────
        class Hexagon {
            constructor(radius, rotSpeed, opacity) {
                this.radius   = radius;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = rotSpeed;
                this.opacity  = opacity;
                this.pts = Array.from({ length: 6 }, (_, i) => {
                    const a = (i * Math.PI * 2) / 6;
                    return { x: Math.cos(a) * radius, y: Math.sin(a) * radius };
                });
            }

            update() { this.rotation += this.rotSpeed; }

            draw(ctx, cx, cy, color) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.rotation);
                ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                this.pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.stroke();
                this.pts.forEach(p => {
                    ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${this.opacity * 2})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }
        }

        // ── Ring ──────────────────────────────────────────────────────
        class Ring {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.radius    = orbRadius;
                this.maxRadius = orbRadius * 4;
                this.opacity   = 1;
                this.speed     = 3;
                this.color     = color;
            }

            update() {
                this.radius += this.speed;
                this.opacity = Math.max(0, 1 - (this.radius - orbRadius) / (this.maxRadius - orbRadius));
                return this.opacity > 0;
            }

            draw(ctx) {
                const g = ctx.createRadialGradient(this.x, this.y, this.radius - 5, this.x, this.y, this.radius + 5);
                g.addColorStop(0, `rgba(${this.color.r},${this.color.g},${this.color.b},${this.opacity * 0.3})`);
                g.addColorStop(1, `rgba(${this.color.r},${this.color.g},${this.color.b},0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(${this.color.r},${this.color.g},${this.color.b},${this.opacity * 0.7})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // ── Init objects ──────────────────────────────────────────────
        for (let i = 0; i < 25; i++) particles.push(new Particle());
        for (let i = 0; i < 10; i++) dataStreams.push(new DataStream());
        hexagons.push(new Hexagon(orbRadius + 20,  0.002, 0.3));
        hexagons.push(new Hexagon(orbRadius + 40, -0.001, 0.2));
        hexagons.push(new Hexagon(orbRadius + 60,  0.003, 0.1));

        // ── State management ──────────────────────────────────────────
        function changeState(newState) {
            if (!stateColors[newState]) return;
            currentState = newState;
            const c = STATE_CSS_COLORS[newState];
            stateLabel.textContent  = STATE_LABELS[newState];
            stateLabel.style.color      = c;
            stateLabel.style.textShadow = `0 0 10px ${c}`;
            document.querySelectorAll('.voice-bar').forEach(b => {
                b.style.background = c;
                b.style.boxShadow  = `0 0 10px ${c}`;
            });
            if (newState === 'speaking') createSoundWaves();
        }

        function createSoundWaves() {
            const color = stateColors.speaking;
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    rings.push(new Ring(canvas.width / 2, canvas.height / 2, color));
                }, i * 150);
            }
        }

        // ── Voice bars ────────────────────────────────────────────────
        function animateVoiceBars() {
            const bars = document.querySelectorAll('.voice-bar');
            const active = currentState === 'speaking' || currentState === 'listening';
            bars.forEach((bar, i) => {
                if (active) {
                    const h = 5 + Math.random() * 30 + Math.sin(Date.now() * 0.01 + i) * 10;
                    bar.style.height = Math.max(5, h) + 'px';
                } else {
                    bar.style.height = '5px';
                }
            });
        }

        // ── Draw orb ──────────────────────────────────────────────────
        function drawOrb(cx, cy, time) {
            const color = stateColors[currentState];
            let pulse;
            switch (currentState) {
                case 'rest':      pulse = 0.5 + Math.sin(time * 0.002) * 0.2; break;
                case 'listening': pulse = 0.7 + Math.sin(time * 0.005) * 0.3; break;
                case 'working':   pulse = 0.8 + Math.sin(time * 0.008) * 0.4; break;
                case 'speaking':  pulse = 0.9 + Math.random() * 0.3;          break;
                default:          pulse = 0.5;
            }

            const r = orbRadius * pulse;

            // Glitch flash
            if (Math.random() < glitchIntensity) {
                ctx.save();
                ctx.translate(Math.random() * 10 - 5, Math.random() * 10 - 5);
                ctx.globalAlpha = 0.5;
                ctx.fillStyle = 'rgba(255,0,0,0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            // Scan lines
            ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},0.08)`;
            ctx.lineWidth = 0.5;
            for (let i = -r * 2; i <= r * 2; i += 4) {
                ctx.beginPath();
                ctx.moveTo(cx - r * 2, cy + i);
                ctx.lineTo(cx + r * 2, cy + i);
                ctx.stroke();
            }

            // Outer glow
            const og = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
            og.addColorStop(0,   `rgba(${color.r},${color.g},${color.b},0.6)`);
            og.addColorStop(0.3, `rgba(${color.r},${color.g},${color.b},0.2)`);
            og.addColorStop(0.7, `rgba(${color.r},${color.g},${color.b},0.05)`);
            og.addColorStop(1,   `rgba(${color.r},${color.g},${color.b},0)`);
            ctx.fillStyle = og;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
            ctx.fill();

            // Plasma
            const px = cx + Math.sin(time * 0.003) * 10;
            const py = cy + Math.cos(time * 0.004) * 10;
            const pg = ctx.createRadialGradient(px, py, 0, cx, cy, r);
            pg.addColorStop(0,   'rgba(255,255,255,0.9)');
            pg.addColorStop(0.2, `rgba(${color.r},${color.g},${color.b},0.8)`);
            pg.addColorStop(0.5, `rgba(${Math.min(255,color.r+100)},${Math.min(255,color.g+100)},${Math.min(255,color.b+100)},0.5)`);
            pg.addColorStop(0.8, `rgba(${color.r},${color.g},${color.b},0.3)`);
            pg.addColorStop(1,   `rgba(${color.r},${color.g},${color.b},0.1)`);
            ctx.fillStyle = pg;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // Energy core
            const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.3);
            cg.addColorStop(0, `rgba(255,255,255,${pulse})`);
            cg.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Lens flares
            for (let i = 1; i <= 3; i++) {
                ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${0.05 / i})`;
                ctx.beginPath();
                ctx.arc(
                    cx + (cx - canvas.width  / 2) * i * 0.1,
                    cy + (cy - canvas.height / 2) * i * 0.1,
                    r * (0.8 - i * 0.2), 0, Math.PI * 2
                );
                ctx.fill();
            }
        }

        // ── Animation loop ────────────────────────────────────────────
        function animate(time) {
            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0,212,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width;  x += 50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);  ctx.stroke(); }

            const color = stateColors[currentState];
            const cx = canvas.width  / 2 + (mouseX - canvas.width  / 2) * 0.05;
            const cy = canvas.height / 2 + (mouseY - canvas.height / 2) * 0.05;

            dataStreams.forEach(s => { s.update(); s.draw(ctx, color); });
            hexagons.forEach(h   => { h.update();  h.draw(ctx, cx, cy, color); });
            particles.forEach(p  => { p.update(cx, cy, time); p.draw(ctx, color, time); });
            drawOrb(cx, cy, time);
            rings = rings.filter(r => { r.update(); r.draw(ctx); return r.opacity > 0; });
            animateVoiceBars();

            // Random glitch
            if (Math.random() < 0.001) {
                glitchIntensity = Math.random() * 0.3;
                lastGlitchTime  = time;
            } else if (time - lastGlitchTime > 200) {
                glitchIntensity = 0;
            }

            requestAnimationFrame(animate);
        }

        // ── Mouse ─────────────────────────────────────────────────────
        canvas.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            mouseInfluence = 1;
            clearTimeout(window._mt);
            window._mt = setTimeout(() => { mouseInfluence = 0; }, 100);
        });

        // ── Keyboard shortcuts (debug) ─────────────────────────────────
        document.addEventListener('keydown', e => {
            const map = { '1': 'rest', '2': 'listening', '3': 'working', '4': 'speaking' };
            if (map[e.key]) changeState(map[e.key]);
        });

        // ── SSE : écouter les changements d'état depuis Python ─────────
        (function connectSSE() {
            const es = new EventSource('/events');
            es.addEventListener('state', e => {
                changeState(e.data.trim());
            });
            es.onerror = () => {
                // Reconnexion automatique après 2 s si le serveur n'est pas encore prêt
                es.close();
                setTimeout(connectSSE, 2000);
            };
        })();

        // ── Start ─────────────────────────────────────────────────────
        requestAnimationFrame(animate);
    </script>
</body>
</html>
