<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000822"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    <radialGradient id="orb-grad" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#80eeff"/>
      <stop offset="45%"  stop-color="#00d4ff"/>
      <stop offset="70%"  stop-color="#0055cc"/>
      <stop offset="100%" stop-color="#000833"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0066ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#aaf0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-blur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="tiny-blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>

  <!-- Grille de fond -->
  <g stroke="#00d4ff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0"   y1="50"  x2="400" y2="50"/>
    <line x1="0"   y1="100" x2="400" y2="100"/>
    <line x1="0"   y1="150" x2="400" y2="150"/>
    <line x1="0"   y1="200" x2="400" y2="200"/>
    <line x1="0"   y1="250" x2="400" y2="250"/>
    <line x1="0"   y1="300" x2="400" y2="300"/>
    <line x1="0"   y1="350" x2="400" y2="350"/>
    <line x1="50"  y1="0"   x2="50"  y2="400"/>
    <line x1="100" y1="0"   x2="100" y2="400"/>
    <line x1="150" y1="0"   x2="150" y2="400"/>
    <line x1="200" y1="0"   x2="200" y2="400"/>
    <line x1="250" y1="0"   x2="250" y2="400"/>
    <line x1="300" y1="0"   x2="300" y2="400"/>
    <line x1="350" y1="0"   x2="350" y2="400"/>
  </g>

  <!-- ═══ DATA STREAMS (pluie binaire) ═══ -->
  <g font-family="Courier New, monospace" font-size="9" fill="#00d4ff">
    <!-- Colonne 1 -->
    <text x="18" fill-opacity="0.35">
      <tspan x="18" dy="0">1</tspan>
      <tspan x="18" dy="12">0</tspan>
      <tspan x="18" dy="12">1</tspan>
      <tspan x="18" dy="12">1</tspan>
      <animate attributeName="y" values="-20;420" dur="4s" repeatCount="indefinite"/>
    </text>
    <!-- Colonne 2 -->
    <text x="360" fill-opacity="0.3">
      <tspan x="360" dy="0">0</tspan>
      <tspan x="360" dy="12">1</tspan>
      <tspan x="360" dy="12">0</tspan>
      <animate attributeName="y" values="-50;420" dur="5.5s" repeatCount="indefinite"/>
    </text>
    <!-- Colonne 3 -->
    <text x="40" fill-opacity="0.2">
      <tspan x="40" dy="0">1</tspan>
      <tspan x="40" dy="12">0</tspan>
      <tspan x="40" dy="12">1</tspan>
      <tspan x="40" dy="12">0</tspan>
      <tspan x="40" dy="12">1</tspan>
      <animate attributeName="y" values="100;450" dur="6s" repeatCount="indefinite"/>
    </text>
    <!-- Colonne 4 -->
    <text x="345" fill-opacity="0.25">
      <tspan x="345" dy="0">1</tspan>
      <tspan x="345" dy="12">1</tspan>
      <tspan x="345" dy="12">0</tspan>
      <animate attributeName="y" values="50;450" dur="4.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ═══ HEXAGONE EXTÉRIEUR ═══ -->
  <g transform="translate(200,200)">
    <polygon points="0,-155 134,-77 134,77 0,155 -134,77 -134,-77"
      fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.12">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ═══ HEXAGONE MOYEN ═══ -->
  <g transform="translate(200,200)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,-60 -104,60"
      fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.18">
      <animateTransform attributeName="transform" type="rotate"
        from="30" to="-330" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ═══ ANNEAUX ORBITAUX ═══ -->
  <!-- Anneau 1 — grand -->
  <circle cx="200" cy="200" r="135"
    fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.2"
    stroke-dasharray="6 5">
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneau 2 — moyen -->
  <circle cx="200" cy="200" r="105"
    fill="none" stroke="#00aaff" stroke-width="0.8" stroke-opacity="0.25">
    <animate attributeName="r" values="105;109;105" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Point tournant anneau 2 -->
  <circle r="4" fill="#00d4ff" filter="url(#tiny-blur)">
    <animate attributeName="cx" values="305;200;95;200;305" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="cy" values="200;95;200;305;200"  dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9;0.5;0.9" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneau 3 — petit -->
  <circle cx="200" cy="200" r="82"
    fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.3"
    stroke-dasharray="3 7">
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="-360 200 200" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ PARTICULES ORBITALES ═══ -->
  <!-- Particule A -->
  <circle r="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="cx" values="335;200;65;200;335" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="cy" values="200;65;200;335;200"  dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
  </circle>
  <!-- Trail A -->
  <circle r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="cx" values="335;200;65;200;335" dur="7s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="cy" values="200;65;200;335;200"  dur="7s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
  </circle>

  <!-- Particule B (orbit inverse) -->
  <circle r="2.5" fill="#80eeff" opacity="0.7">
    <animate attributeName="cx" values="65;200;335;200;65"   dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="cy" values="200;65;200;335;200"  dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
  </circle>

  <!-- Particule C (orbit inclinée) -->
  <circle r="2" fill="#00ffcc" opacity="0.6">
    <animate attributeName="cx" values="310;240;90;160;310" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;310;290;90;110"  dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Particule D (petite, rapide) -->
  <circle r="1.5" fill="#ffffff" opacity="0.5">
    <animate attributeName="cx" values="280;120;200;320;280" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;280;80;280;120"  dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ GLOW EXTERNE ═══ -->
  <circle cx="200" cy="200" r="90" fill="url(#glow1)" filter="url(#soft-blur)">
    <animate attributeName="r"       values="90;98;90"    dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1"     dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="75" fill="url(#glow2)" filter="url(#soft-blur)">
    <animate attributeName="r" values="75;80;75" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ ORBE PRINCIPALE ═══ -->
  <circle cx="200" cy="200" r="72" fill="url(#orb-grad)">
    <animate attributeName="r"       values="72;76;72"    dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Scan lines sur l'orbe -->
  <g clip-path="url(#orb-clip)" opacity="0.06">
    <clipPath id="orb-clip"><circle cx="200" cy="200" r="72"/></clipPath>
    <line x1="128" y1="168" x2="272" y2="168" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="176" x2="272" y2="176" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="184" x2="272" y2="184" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="192" x2="272" y2="192" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="200" x2="272" y2="200" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="208" x2="272" y2="208" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="216" x2="272" y2="216" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="224" x2="272" y2="224" stroke="#00d4ff" stroke-width="1"/>
    <line x1="128" y1="232" x2="272" y2="232" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- Reflet interne -->
  <ellipse cx="182" cy="172" rx="18" ry="10"
    fill="white" opacity="0.2" transform="rotate(-35 182 172)">
    <animate attributeName="opacity" values="0.2;0.35;0.2" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="178" cy="168" rx="8" ry="4"
    fill="white" opacity="0.4" transform="rotate(-35 178 168)">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Noyau lumineux -->
  <circle cx="200" cy="200" r="22" fill="url(#core)" filter="url(#tiny-blur)">
    <animate attributeName="r"       values="22;26;22"    dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9"   dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="8" fill="white" opacity="0.95">
    <animate attributeName="r"       values="8;10;8"      dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ ONDES SONORES ═══ -->
  <circle cx="200" cy="200" r="72" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0">
    <animate attributeName="r"       values="72;140;150"  dur="3s" begin="0s"    repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0"   dur="3s" begin="0s"    repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="72" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0">
    <animate attributeName="r"       values="72;130;145"  dur="3s" begin="1s"    repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0"   dur="3s" begin="1s"    repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="72" fill="none" stroke="#00aaff" stroke-width="0.8" opacity="0">
    <animate attributeName="r"       values="72;120;140"  dur="3s" begin="2s"    repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.05;0"  dur="3s" begin="2s"    repeatCount="indefinite"/>
  </circle>

  <!-- ═══ BARRES SONORES ═══ -->
  <g transform="translate(200,355)">
    <rect x="-33" y="0" width="3" height="-5" rx="1.5" fill="#00d4ff" opacity="0.8">
      <animate attributeName="height" values="5;18;6;22;5" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-5;-18;-6;-22;-5" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-22" y="0" width="3" height="-8" rx="1.5" fill="#00d4ff" opacity="0.9">
      <animate attributeName="height" values="8;25;10;20;8" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-8;-25;-10;-20;-8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-11" y="0" width="3" height="-12" rx="1.5" fill="#00d4ff">
      <animate attributeName="height" values="12;28;8;24;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-28;-8;-24;-12" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0"  width="3" height="-15" rx="1.5" fill="#80eeff">
      <animate attributeName="height" values="15;30;10;26;15" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-15;-30;-10;-26;-15" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="11" y="0" width="3" height="-12" rx="1.5" fill="#00d4ff">
      <animate attributeName="height" values="12;24;8;28;12" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-12;-24;-8;-28;-12" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="22" y="0" width="3" height="-8" rx="1.5" fill="#00d4ff" opacity="0.9">
      <animate attributeName="height" values="8;20;12;25;8" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-8;-20;-12;-25;-8" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="33" y="0" width="3" height="-5" rx="1.5" fill="#00d4ff" opacity="0.8">
      <animate attributeName="height" values="5;16;7;20;5" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="-5;-16;-7;-20;-5" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ TEXTES ═══ -->
  <!-- Label état -->
  <text x="200" y="38" text-anchor="middle"
    font-family="Courier New, monospace" font-size="11"
    fill="#00d4ff" letter-spacing="5" font-weight="bold">
    EN VEILLE
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Titre JARVIS -->
  <text x="200" y="385" text-anchor="middle"
    font-family="Courier New, monospace" font-size="22"
    fill="#00d4ff" letter-spacing="12" font-weight="bold"
    filter="url(#tiny-blur)">
    JARVIS
  </text>
  <text x="200" y="385" text-anchor="middle"
    font-family="Courier New, monospace" font-size="22"
    fill="#00d4ff" letter-spacing="12" font-weight="bold">
    JARVIS
    <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Sous-titre -->
  <text x="200" y="400" text-anchor="middle"
    font-family="Courier New, monospace" font-size="7"
    fill="#00d4ff" letter-spacing="3" opacity="0.5">
    ASSISTANT VOCAL · LOCAL · FRANÇAIS
  </text>
</svg>
