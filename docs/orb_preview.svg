<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Fond -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000822"/>
      <stop offset="100%" stop-color="#000011"/>
    </radialGradient>

    <!-- Orbe principale -->
    <radialGradient id="orb" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%"  stop-color="#00d4ff"/>
      <stop offset="65%"  stop-color="#0055aa"/>
      <stop offset="100%" stop-color="#001133"/>
    </radialGradient>

    <!-- Glow externe -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre flou pour le glow -->
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="200" height="200" fill="url(#bg)" rx="16"/>

  <!-- Grille de fond -->
  <g stroke="#00d4ff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="40"  x2="200" y2="40"/>
    <line x1="0" y1="80"  x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40"  y1="0" x2="40"  y2="200"/>
    <line x1="80"  y1="0" x2="80"  y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
  </g>

  <!-- Particules orbitales -->
  <g fill="#00d4ff">
    <circle cx="100" cy="100" r="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate"
        from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="100;165;100;35;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="45;100;155;100;45" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="1.2" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate"
        from="120 100 100" to="480 100 100" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="170;100;30;100;170" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;170;100;30;100"  dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1" opacity="0.5">
      <animate attributeName="cx" values="100;155;100;45;100" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="155;100;45;100;155"  dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Anneau extérieur (rotation) -->
  <circle cx="100" cy="100" r="72"
    fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.2"
    stroke-dasharray="8 4">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneau hexagonal -->
  <polygon points="100,28 164,64 164,136 100,172 36,136 36,64"
    fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.15">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="-360 100 100" dur="30s" repeatCount="indefinite"/>
  </polygon>

  <!-- Anneau moyen -->
  <circle cx="100" cy="100" r="58"
    fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.25">
    <animate attributeName="r" values="58;62;58" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Point tournant sur l'anneau -->
  <circle r="3" fill="#00d4ff" filter="url(#blur-soft)">
    <animate attributeName="cx" values="158;100;42;100;158" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;42;100;158;100"  dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1;0.6;1"  dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Halo de glow (flou) -->
  <circle cx="100" cy="100" r="52" fill="url(#glow)" filter="url(#blur-glow)">
    <animate attributeName="r" values="52;58;52" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbe principale -->
  <circle cx="100" cy="100" r="42" fill="url(#orb)">
    <animate attributeName="r" values="42;45;42" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Reflet interne -->
  <ellipse cx="88" cy="84" rx="10" ry="6"
    fill="white" opacity="0.25" transform="rotate(-30 88 84)">
    <animate attributeName="opacity" values="0.25;0.4;0.25" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Noyau lumineux -->
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.7" filter="url(#blur-soft)">
    <animate attributeName="r"       values="8;10;8"       dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7"    dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ondes sonores (bas) -->
  <g transform="translate(100,168)" stroke="#00d4ff" fill="none">
    <line x1="-18" y1="0" x2="-18" y2="-6" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="y2" values="-6;-14;-6" dur="0.9s" begin="0s"    repeatCount="indefinite"/>
    </line>
    <line x1="-10" y1="0" x2="-10" y2="-10" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="y2" values="-10;-20;-10" dur="0.9s" begin="0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="-2"  y1="0" x2="-2"  y2="-14" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <animate attributeName="y2" values="-14;-24;-14" dur="0.9s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="6"   y1="0" x2="6"   y2="-10" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="y2" values="-10;-20;-10" dur="0.9s" begin="0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="14"  y1="0" x2="14"  y2="-6"  stroke-width="2.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="y2" values="-6;-14;-6" dur="0.9s" begin="0s"    repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Label "EN VEILLE" -->
  <text x="100" y="22" text-anchor="middle"
    font-family="Courier New, monospace" font-size="7" fill="#00d4ff"
    letter-spacing="3" opacity="0.8">
    EN VEILLE
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Label "JARVIS" -->
  <text x="100" y="193" text-anchor="middle"
    font-family="Courier New, monospace" font-size="9" fill="#00d4ff"
    letter-spacing="5" font-weight="bold" opacity="0.9">
    JARVIS
  </text>
</svg>
